# Packaged per-tool argument schemas (D-005 item 4).
#
# Every tool used by the default policy, the scripted experiments
# (experiments/policies.py) and the AgentDojo v1 replay
# (experiments/agentdojo_replay.py, all four suites) declares its arguments
# here with a type. ``asu.config.load_policy`` fills ``tools.<name>.args`` from
# this file for every tool the policy lists (an explicit ``args`` entry in the
# policy overrides the type of that argument; ``schema_library: false`` in a
# policy disables the merge). A tool with a schema is CLOSED: a call carrying
# any argument not listed is denied (``unknown_argument:<name>``).
#
# Types: recipient | account | amount | currency | path | url | argv | text |
#        flag | int | enum (with values) | env | json (verbatim structured value)
# Grants bind every argument exactly, except ``amount`` (free up to the
# approved amount) and ``text`` (free, length-bounded); recipients, accounts,
# paths and urls are never free (D-005 item 5).

# ---------------------------------------------------------------- default policy / scenarios
read_file:       {path: path, file_path: path}
list_dir:        {path: path}
read_inbox:      {folder: text, user: account}
write_file:      {path: path, content: text, append: flag}
delete_file:     {path: path, paths: path, file_id: account, recursive: flag}
send_email:
  to: recipient
  cc: recipient
  bcc: recipient
  recipients: recipient
  subject: text
  body: text
  attachments: json
send_message:    {to: recipient, recipient: recipient, channel: account, body: text, text: text}
transfer_money:  {to_account: account, payee: account, amount: amount, currency: currency, memo: text}
http_request:
  url: url
  method: {type: enum, values: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]}
  body: text
  headers: json
http_post:       {url: url, body: text, headers: json}
run_shell:       {command: argv, cwd: path, env: env, timeout_s: int}
change_settings: {setting: text, value: json}
remove_member:   {member: account, reason: text}

